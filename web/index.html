<!doctype html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Codebase Assistant — 근거를 보여주는 코드베이스 어시스턴트</title>
<meta name="description" content="프로젝트의 문서·소스코드·git 이력을 지식원으로, 근거와 출처를 함께 제시하는 RAG 어시스턴트" />
<style>
/* ============================================================================
   디자인 토큰 — 색·간격·타이포를 값이 아니라 이름으로 다룬다.
   라이트/다크는 토큰만 갈아끼우고 컴포넌트 CSS 는 건드리지 않는다.
   ========================================================================== */
:root {
  --c-bg:        #f7f8fa;
  --c-surface:   #ffffff;
  --c-elev:      #ffffff;
  --c-border:    #e3e6ec;
  --c-border-str:#cbd2dd;
  --c-text:      #16191f;
  --c-text-dim:  #5b6472;
  --c-text-mute: #8b94a3;
  --c-accent:    #3b5bdb;
  --c-accent-sub:#eaeeff;
  --c-accent-fg: #ffffff;
  --c-doc:       #1c7ed6;  --c-doc-bg:    #e7f2fd;
  --c-code:      #7048e8;  --c-code-bg:   #f0ebff;
  --c-commit:    #e8590c;  --c-commit-bg: #fdeee3;
  --c-ok:        #2f9e44;
  --c-warn:      #e03131;  --c-warn-bg:   #fdecec;

  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-full: 999px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --shadow-1: 0 1px 2px rgba(16,24,40,.05);
  --shadow-2: 0 4px 16px rgba(16,24,40,.08);
  --shadow-3: 0 12px 32px rgba(16,24,40,.14);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo",
          "Malgun Gothic", Roboto, sans-serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", Consolas, "D2Coding", monospace;

  --sidebar-w: 268px;
  --max-read: 760px;   /* 본문 최대폭 — 한 줄이 길어지면 읽기 어렵다 */
}
:root[data-theme="dark"], :root[data-theme="auto"] {
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] { color-scheme: dark; }
}
:root[data-theme="dark"], :root[data-theme="auto"] { }

/* 다크 팔레트 — 명시 선택(data-theme=dark) 과 시스템 설정(auto) 양쪽에 적용 */
:root[data-theme="dark"],
:root[data-theme="auto"] { }
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --c-bg:#0f1115; --c-surface:#161a21; --c-elev:#1c212a; --c-border:#262c37;
    --c-border-str:#39424f; --c-text:#e6e9ef; --c-text-dim:#a3acbb; --c-text-mute:#727d8d;
    --c-accent:#748ffc; --c-accent-sub:#1e2540; --c-accent-fg:#0f1115;
    --c-doc:#4dabf7; --c-doc-bg:#132437; --c-code:#b197fc; --c-code-bg:#241f3a;
    --c-commit:#ffa94d; --c-commit-bg:#33220f; --c-ok:#51cf66;
    --c-warn:#ff8787; --c-warn-bg:#37191c;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 4px 16px rgba(0,0,0,.45);
    --shadow-3:0 12px 32px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --c-bg:#0f1115; --c-surface:#161a21; --c-elev:#1c212a; --c-border:#262c37;
  --c-border-str:#39424f; --c-text:#e6e9ef; --c-text-dim:#a3acbb; --c-text-mute:#727d8d;
  --c-accent:#748ffc; --c-accent-sub:#1e2540; --c-accent-fg:#0f1115;
  --c-doc:#4dabf7; --c-doc-bg:#132437; --c-code:#b197fc; --c-code-bg:#241f3a;
  --c-commit:#ffa94d; --c-commit-bg:#33220f; --c-ok:#51cf66;
  --c-warn:#ff8787; --c-warn-bg:#37191c;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 4px 16px rgba(0,0,0,.45);
  --shadow-3:0 12px 32px rgba(0,0,0,.55);
}

/* --- 리셋 ---------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--c-bg); color: var(--c-text);
  font-family: var(--font); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  /* 한국어는 어절 단위로 끊어야 읽힌다. 기본값(break-word)이면 단어 중간에서 잘린다. */
  word-break: keep-all; overflow-wrap: anywhere;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; border-radius: var(--r-sm); }
:focus:not(:focus-visible) { outline: none; }

/* 접근성 — 애니메이션을 줄여달라는 시스템 설정을 존중한다 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: var(--s-3); top: -60px; z-index: 100;
  background: var(--c-accent); color: var(--c-accent-fg);
  padding: var(--s-2) var(--s-3); border-radius: var(--r-md); transition: top .15s;
}
.skip-link:focus { top: var(--s-3); }

/* ============================================================================
   레이아웃 — 데스크톱은 사이드바 + 본문, 모바일은 드로어
   ========================================================================== */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100dvh; }

/* --- 사이드바 ------------------------------------------------------------ */
.sidebar {
  background: var(--c-surface); border-right: 1px solid var(--c-border);
  display: flex; flex-direction: column; min-height: 0;
}
.brand {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4); border-bottom: 1px solid var(--c-border);
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  background: linear-gradient(135deg, var(--c-accent), #9775fa);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
}
.brand-text { min-width: 0; }
.brand-title { font-weight: 650; font-size: 14px; letter-spacing: -.01em; }
.brand-sub { font-size: 11.5px; color: var(--c-text-mute); }

.side-scroll { flex: 1; overflow-y: auto; padding: var(--s-4); min-height: 0; }
.side-section + .side-section { margin-top: var(--s-5); }
.side-label {
  font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase;
  color: var(--c-text-mute); margin-bottom: var(--s-2);
}

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
.stat {
  background: var(--c-bg); border: 1px solid var(--c-border);
  border-radius: var(--r-md); padding: var(--s-2) var(--s-3);
}
.stat-num { font-size: 17px; font-weight: 680; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat-lab { font-size: 11px; color: var(--c-text-mute); }

.file-list { display: flex; flex-direction: column; gap: 2px; max-height: 232px; overflow-y: auto; }
.file-item {
  display: flex; align-items: center; gap: var(--s-2);
  font-size: 12.5px; color: var(--c-text-dim); padding: 3px var(--s-2);
  border-radius: var(--r-sm); font-family: var(--font-mono);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.file-item:hover { background: var(--c-bg); color: var(--c-text); }

.side-foot { border-top: 1px solid var(--c-border); padding: var(--s-3) var(--s-4); }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
.row + .row { margin-top: var(--s-3); }
.row-label { font-size: 13px; }
.row-hint { font-size: 11px; color: var(--c-text-mute); margin-top: 1px; }

/* 스위치 */
.switch { position: relative; display: inline-flex; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track {
  width: 38px; height: 22px; border-radius: var(--r-full);
  background: var(--c-border-str); transition: background .18s; display: block;
}
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
  background: #fff; border-radius: 50%; transition: transform .18s; box-shadow: var(--shadow-1);
}
.switch input:checked + .track { background: var(--c-accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--c-accent); outline-offset: 2px; }

/* 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  border: 1px solid var(--c-border-str); background: var(--c-surface);
  border-radius: var(--r-md); padding: 7px var(--s-3); font-size: 13px; font-weight: 550;
  cursor: pointer; transition: background .14s, border-color .14s, transform .06s;
}
.btn:hover { background: var(--c-bg); border-color: var(--c-text-mute); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-accent-fg); }
.btn-primary:hover { background: var(--c-accent); filter: brightness(1.08); }
.btn-block { width: 100%; }
.btn-icon { padding: 5px; border: 0; background: transparent; color: var(--c-text-mute); border-radius: var(--r-sm); }
.btn-icon:hover { background: var(--c-bg); color: var(--c-text); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* --- 본문 ---------------------------------------------------------------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--c-border);
  background: color-mix(in srgb, var(--c-surface) 82%, transparent);
  backdrop-filter: saturate(1.6) blur(8px); position: sticky; top: 0; z-index: 5;
}
.topbar h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--c-text-dim); background: var(--c-bg);
  border: 1px solid var(--c-border); border-radius: var(--r-full); padding: 3px 9px;
  white-space: nowrap;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-ok); flex: none; }
.dot.warn { background: var(--c-warn); }

.thread { flex: 1; overflow-y: auto; scroll-behavior: smooth; overscroll-behavior: contain; }
.thread-inner {
  max-width: var(--max-read); margin: 0 auto; padding: var(--s-5) var(--s-4) var(--s-6);
  min-height: 100%; display: flex; flex-direction: column;
}
/* 대화가 없을 때만 빈 상태를 세로 중앙에 둔다(대화가 시작되면 위에서부터 쌓인다) */
.thread-inner:has(> .empty:not([hidden])) { justify-content: center; }

/* --- 빈 상태 ------------------------------------------------------------- */
.empty { text-align: center; padding: var(--s-6) 0; flex: none; }
.empty h2 { font-size: 21px; font-weight: 660; letter-spacing: -.02em; margin: 0 0 var(--s-2); text-wrap: balance; }
.empty p { color: var(--c-text-dim); margin: 0 auto var(--s-5); max-width: 52ch; font-size: 14px; text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); justify-content: center; }
.chip {
  max-width: 100%; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-text-dim);
  border-radius: var(--r-full); padding: 7px 14px; font-size: 13px; cursor: pointer;
  transition: border-color .14s, color .14s, background .14s; text-align: left;
}
.chip:hover { border-color: var(--c-accent); color: var(--c-accent); background: var(--c-accent-sub); }

/* --- 메시지 -------------------------------------------------------------- */
.turn { margin-bottom: var(--s-5); }
.turn.user { display: flex; justify-content: flex-end; }
.bubble-user {
  background: var(--c-accent); color: var(--c-accent-fg);
  padding: 10px var(--s-4); border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg);
  max-width: 82%; white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow-1);
}
.answer { display: flex; gap: var(--s-3); }
.avatar {
  width: 28px; height: 28px; border-radius: 8px; flex: none; margin-top: 2px;
  background: linear-gradient(135deg, var(--c-accent), #9775fa);
  display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700;
}
.answer-body { min-width: 0; flex: 1; }

/* 재작성 배지 — 무엇으로 검색했는지 숨기지 않는다 */
.rewrite {
  display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap;
  font-size: 12px; color: var(--c-text-dim); background: var(--c-accent-sub);
  border: 1px solid color-mix(in srgb, var(--c-accent) 22%, transparent);
  border-radius: var(--r-md); padding: 6px 10px; margin-bottom: var(--s-3);
}
.rewrite b { color: var(--c-accent); font-weight: 600; }
.rewrite q { font-style: normal; color: var(--c-text); }
/* 버려진 재작성 — 경고색으로 두되 흐리게(오류가 아니라 방어가 작동한 것이다) */
.rewrite.is-rejected { background: transparent; border-color: var(--c-border); }
.rewrite.is-rejected b { color: var(--c-text-mute); }
.rewrite.is-rejected q { color: var(--c-text-mute); text-decoration: line-through; }
.rewrite .why { color: var(--c-text-mute); font-size: 11.5px; }

/* 경로 배지 — 에이전트는 LLM 을 3~5회 부르고 ~10초 걸린다.
   답이 안 나오는 동안 사용자가 '멈춘 건가'로 읽지 않도록 이유를 먼저 보인다. */
.route {
  display: inline-flex; gap: 6px; align-items: baseline; flex-wrap: wrap;
  font-size: 12px; color: var(--c-text-dim);
  border: 1px solid var(--c-border); border-radius: var(--r-md);
  padding: 5px 9px; margin-bottom: var(--s-3);
}
.route .tag { font-weight: 700; font-size: 11px; letter-spacing: .02em; }
.route.is-agent { border-color: color-mix(in srgb, var(--c-accent) 40%, transparent);
  background: var(--c-accent-sub); }
.route.is-agent .tag { color: var(--c-accent); }
.route .why { color: var(--c-text-mute); }

/* 마크다운 본문 */
.md { word-break: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 var(--s-3); }
.md h1,.md h2,.md h3,.md h4 { margin: var(--s-5) 0 var(--s-2); font-weight: 650; letter-spacing: -.01em; line-height: 1.35; }
.md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 14.5px; }
.md ul,.md ol { margin: 0 0 var(--s-3); padding-left: 1.35em; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--c-text-mute); }
.md code, .src-path, .src-body, .md pre { word-break: break-word; }
.md code {
  font-family: var(--font-mono); font-size: .875em; background: var(--c-bg);
  border: 1px solid var(--c-border); border-radius: var(--r-sm); padding: 1px 5px;
}
.md pre {
  background: var(--c-elev); border: 1px solid var(--c-border); border-radius: var(--r-md);
  padding: var(--s-3); overflow-x: auto; margin: 0 0 var(--s-3); font-size: 12.5px; line-height: 1.6;
}
.md pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.md blockquote {
  margin: 0 0 var(--s-3); padding: var(--s-2) var(--s-4); color: var(--c-text-dim);
  border-left: 3px solid var(--c-border-str); background: var(--c-bg); border-radius: 0 var(--r-sm) var(--r-sm) 0;
}
.md table { border-collapse: collapse; width: 100%; margin: 0 0 var(--s-3); font-size: 13.5px; display: block; overflow-x: auto; }
.md th,.md td { border: 1px solid var(--c-border); padding: 6px 10px; text-align: left; }
.md th { background: var(--c-bg); font-weight: 620; }
.md hr { border: 0; border-top: 1px solid var(--c-border); margin: var(--s-4) 0; }
.md a { color: var(--c-accent); }
.md .fn {  /* 각주 [1] — 클릭하면 해당 출처로 */
  display: inline-block; min-width: 17px; height: 17px; line-height: 17px; text-align: center;
  font-size: 10.5px; font-weight: 650; vertical-align: 1px; margin: 0 1px;
  background: var(--c-accent-sub); color: var(--c-accent); border-radius: var(--r-sm);
  cursor: pointer; border: 0; padding: 0 4px;
}
.md .fn:hover { background: var(--c-accent); color: var(--c-accent-fg); }
details.codefold > summary {
  cursor: pointer; font-size: 12.5px; color: var(--c-text-dim); padding: 5px 0; user-select: none;
}
details.codefold[open] > summary { margin-bottom: var(--s-2); }

/* 타이핑 표시 */
.typing { display: inline-flex; gap: 4px; align-items: center; padding: 6px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--c-text-mute); animation: blink 1.3s infinite; }
.typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%,60%,100% { opacity:.25 } 30% { opacity:1 } }

/* 커서(스트리밍 중) */
.caret::after {
  content:""; display:inline-block; width:2px; height:1em; background: var(--c-accent);
  vertical-align:-2px; margin-left:2px; animation: caret 1s step-end infinite;
}
@keyframes caret { 50% { opacity: 0 } }

/* --- 근거 패널 ----------------------------------------------------------- */
.evidence { margin-top: var(--s-4); }
.evidence-head {
  display: flex; align-items: center; gap: var(--s-2);
  font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase;
  color: var(--c-text-mute); margin-bottom: var(--s-2);
}
.src {
  border: 1px solid var(--c-border); background: var(--c-surface);
  border-radius: var(--r-md); margin-bottom: 6px; overflow: hidden;
  transition: border-color .18s, box-shadow .18s;
}
.src[data-hl="1"] { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-sub); }
.src > summary {
  display: flex; align-items: center; gap: var(--s-2); padding: 8px 10px;
  cursor: pointer; list-style: none; font-size: 13px;
}
.src > summary::-webkit-details-marker { display: none; }
.src > summary:hover { background: var(--c-bg); }
.src-idx {
  flex: none; width: 18px; height: 18px; border-radius: var(--r-sm);
  background: var(--c-bg); border: 1px solid var(--c-border);
  font-size: 10.5px; font-weight: 650; display: grid; place-items: center; color: var(--c-text-dim);
}
.badge {
  flex: none; font-size: 10px; font-weight: 700; letter-spacing: .04em;
  padding: 2px 6px; border-radius: var(--r-sm);
}
.badge.doc { background: var(--c-doc-bg); color: var(--c-doc); }
.badge.code { background: var(--c-code-bg); color: var(--c-code); }
.badge.commit { background: var(--c-commit-bg); color: var(--c-commit); }
.src-path {
  font-family: var(--font-mono); font-size: 12px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.src-sec { color: var(--c-text-mute); }
.src-score { margin-left: auto; flex: none; font-size: 11px; color: var(--c-text-mute); font-variant-numeric: tabular-nums; }
.src-body {
  border-top: 1px solid var(--c-border); background: var(--c-bg);
  padding: var(--s-3); font-family: var(--font-mono); font-size: 12px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; color: var(--c-text-dim);
}

/* 검색 진단 */
.diag { margin-top: var(--s-2); }
.diag > summary {
  cursor: pointer; font-size: 12px; color: var(--c-text-mute); list-style: none;
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 0;
}
.diag > summary::-webkit-details-marker { display: none; }
.diag > summary:hover { color: var(--c-text); }
.diag-body {
  border: 1px solid var(--c-border); border-radius: var(--r-md);
  background: var(--c-surface); padding: var(--s-3); margin-top: var(--s-2); font-size: 12px;
}
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px var(--s-3); margin-bottom: var(--s-3); }
.kv dt { color: var(--c-text-mute); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.diag table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.diag th, .diag td { padding: 4px 6px; border-bottom: 1px solid var(--c-border); text-align: left; }
.diag th { color: var(--c-text-mute); font-weight: 600; }
.diag td.num { text-align: right; font-variant-numeric: tabular-nums; }

/* 액션 바 */
.actions { display: flex; align-items: center; gap: var(--s-1); margin-top: var(--s-3); }
.act {
  border: 0; background: transparent; color: var(--c-text-mute); cursor: pointer;
  font-size: 12px; padding: 4px 7px; border-radius: var(--r-sm); display: inline-flex; gap: 5px; align-items: center;
}
.act:hover { background: var(--c-bg); color: var(--c-text); }
.act[aria-pressed="true"] { color: var(--c-accent); background: var(--c-accent-sub); }

/* 오류 */
.error {
  border: 1px solid color-mix(in srgb, var(--c-warn) 40%, transparent); background: var(--c-warn-bg);
  color: var(--c-warn); border-radius: var(--r-md); padding: var(--s-3); font-size: 13px;
  display: flex; gap: var(--s-3); align-items: flex-start;
}
.error .btn { border-color: currentColor; color: inherit; background: transparent; }

/* --- 입력 --------------------------------------------------------------- */
.composer { border-top: 1px solid var(--c-border); background: var(--c-surface); padding: var(--s-3) var(--s-4) var(--s-4); }
.composer-inner { max-width: var(--max-read); margin: 0 auto; }
.input-shell {
  display: flex; align-items: flex-end; gap: var(--s-2);
  border: 1px solid var(--c-border-str); background: var(--c-bg);
  border-radius: var(--r-lg); padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4);
  transition: border-color .15s, box-shadow .15s;
}
.input-shell:focus-within { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-sub); }
#q {
  flex: 1; border: 0; background: none; resize: none; outline: none;
  padding: 7px 0; max-height: 168px; line-height: 1.55;
}
#q::placeholder { color: var(--c-text-mute); }
.send {
  flex: none; width: 34px; height: 34px; border-radius: var(--r-md); border: 0;
  background: var(--c-accent); color: var(--c-accent-fg); cursor: pointer;
  display: grid; place-items: center; transition: filter .14s, background .14s;
}
.send:hover { filter: brightness(1.08); }
.send[disabled] { background: var(--c-border-str); cursor: not-allowed; }
.send.stop { background: var(--c-warn); }
.composer-foot {
  display: flex; justify-content: space-between; gap: var(--s-3);
  font-size: 11.5px; color: var(--c-text-mute); margin-top: 7px; padding: 0 2px;
}
kbd {
  font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--c-border-str);
  border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--c-surface);
}

/* --- 모바일 -------------------------------------------------------------- */
.hamburger { display: none; }
.scrim { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: min(86vw, var(--sidebar-w)); z-index: 30;
    transform: translateX(-100%); transition: transform .22s ease; box-shadow: var(--shadow-3);
  }
  .app[data-drawer="open"] .sidebar { transform: none; }
  .app[data-drawer="open"] .scrim { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.42); }
  .hamburger { display: inline-grid; }
  .thread-inner { padding: var(--s-4) var(--s-3) var(--s-5); }
  .composer { padding: var(--s-2) var(--s-3) calc(var(--s-3) + env(safe-area-inset-bottom)); }
  .bubble-user { max-width: 90%; }
}

/* --- 스크롤바 ------------------------------------------------------------ */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--c-border-str); border-radius: var(--r-full); border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--c-text-mute); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* 토스트 */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(8px);
  background: var(--c-text); color: var(--c-bg); font-size: 13px; padding: 8px 16px;
  border-radius: var(--r-full); box-shadow: var(--shadow-3); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 60;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<a class="skip-link" href="#q">본문 입력으로 건너뛰기</a>

<div class="app" id="app">
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <!-- ===================== 사이드바 ===================== -->
  <aside class="sidebar" id="sidebar" aria-label="지식원 및 설정">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">CA</div>
      <div class="brand-text">
        <div class="brand-title">Codebase Assistant</div>
        <div class="brand-sub">근거를 보여주는 RAG</div>
      </div>
    </div>

    <div class="side-scroll">
      <section class="side-section">
        <h2 class="side-label">인덱싱된 지식원</h2>
        <div class="stat-grid">
          <div class="stat"><div class="stat-num" id="st-doc">–</div><div class="stat-lab">문서</div></div>
          <div class="stat"><div class="stat-num" id="st-code">–</div><div class="stat-lab">소스 파일</div></div>
        </div>
      </section>

      <section class="side-section">
        <h2 class="side-label">문서 목록</h2>
        <div class="file-list" id="files" role="list"></div>
      </section>
    </div>

    <div class="side-foot">
      <div class="row">
        <div>
          <div class="row-label">개발자 모드</div>
          <div class="row-hint">답변에 코드 원문을 인용</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="devmode" />
          <span class="track" aria-hidden="true"></span>
          <span class="sr-only">개발자 모드</span>
        </label>
      </div>
      <div class="row">
        <div>
          <div class="row-label">테마</div>
          <div class="row-hint" id="theme-hint">시스템 설정 따름</div>
        </div>
        <button class="btn" id="theme-btn" type="button" aria-label="테마 전환">시스템</button>
      </div>
      <div class="row">
        <button class="btn btn-block" id="new-chat" type="button">＋ 새 대화</button>
      </div>
    </div>
  </aside>

  <!-- ===================== 본문 ===================== -->
  <div class="main">
    <header class="topbar">
      <button class="btn btn-icon hamburger" id="hamburger" type="button" aria-label="메뉴 열기" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1>프로젝트 질의</h1>
      <div class="spacer"></div>
      <span class="pill" id="turn-pill" hidden>대화 <b id="turn-count">0</b>턴</span>
      <span class="pill" id="status-pill"><span class="dot" id="status-dot"></span><span id="status-text">연결 중…</span></span>
    </header>

    <main class="thread" id="thread" tabindex="-1">
      <div class="thread-inner" id="thread-inner">
        <!-- 빈 상태 -->
        <section class="empty" id="empty">
          <h2>무엇이든 물어보세요</h2>
          <p>이 저장소의 <strong>문서 · 소스코드 · git 이력</strong>을 근거로 답합니다.
             모든 답변에는 출처와 원문 발췌가 함께 표시됩니다.</p>
          <div class="chips" id="chips"></div>
        </section>
      </div>
    </main>

    <!-- 스트리밍 답변을 스크린리더에 알린다(폴라이트 — 입력을 방해하지 않음) -->
    <div class="sr-only" aria-live="polite" aria-atomic="false" id="live"></div>

    <div class="composer">
      <div class="composer-inner">
        <form id="f">
          <div class="input-shell">
            <label class="sr-only" for="q">질문</label>
            <textarea id="q" rows="1" placeholder="질문을 입력하세요…  (Shift+Enter 로 줄바꿈)" autocomplete="off"></textarea>
            <button class="send" id="send" type="submit" aria-label="전송">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </form>
        <div class="composer-foot">
          <span><kbd>Enter</kbd> 전송 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 줄바꿈 · <kbd>Esc</kbd> 중단</span>
          <span id="mode-note"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ============================================================================
   상태 — 대화는 클라이언트가 들고 있고, 매 요청에 직전 턴을 함께 보낸다.
   서버를 무상태로 두면 배포 시 인스턴스를 늘려도 세션 고정이 필요 없다.
   ========================================================================== */
const state = {
  history: [],        // [{role, content}] — 서버로 보낼 대화 맥락
  streaming: false,
  controller: null,   // 진행 중 요청 취소용
  devMode: localStorage.getItem('devMode') === '1',
  theme: localStorage.getItem('theme') || 'auto',
};

const $ = (id) => document.getElementById(id);
const els = {
  thread: $('thread'), inner: $('thread-inner'), empty: $('empty'), chips: $('chips'),
  form: $('f'), q: $('q'), send: $('send'), live: $('live'), toast: $('toast'),
  statusDot: $('status-dot'), statusText: $('status-text'), modeNote: $('mode-note'),
  files: $('files'), stDoc: $('st-doc'), stCode: $('st-code'),
  turnPill: $('turn-pill'), turnCount: $('turn-count'),
};

/* --- 유틸 ---------------------------------------------------------------- */
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

let toastTimer;
function toast(msg) {
  els.toast.textContent = msg; els.toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1900);
}

/* ============================================================================
   마크다운 — 외부 라이브러리 없이 필요한 문법만. 의존성 0 이라 오프라인·CSP 안전.
   ========================================================================== */
function inline(t) {
  return t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    // 각주 [1] → 클릭하면 해당 출처 카드가 열리고 강조된다
    .replace(/\[(\d{1,2})\]/g, '<button type="button" class="fn" data-fn="$1">$1</button>');
}

function renderMarkdown(md, devMode) {
  const lines = esc(md.replace(/\r\n/g, '\n')).split('\n');
  const out = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      const pre = '<pre><code>' + buf.join('\n') + '</code></pre>';
      out.push(devMode ? pre
        : '<details class="codefold"><summary>코드 보기 (' + buf.length + '줄)</summary>' + pre + '</details>');
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = Math.min(h[1].length, 4); out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>'); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (/^\s*\|/.test(line)) {
      const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const isSep = s => { const c = s.trim().replace(/^\|/, '').replace(/\|$/, ''); return c.includes('-') && /^[\s:|-]+$/.test(c); };
      const body = []; let header = null;
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        if (isSep(lines[i])) { if (body.length) header = body.pop(); i++; continue; }
        body.push(cells(lines[i])); i++;
      }
      if (!body.length && !header) continue;
      let t = '<table>';
      if (header) t += '<thead><tr>' + header.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead>';
      t += '<tbody>' + body.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      out.push(t); continue;
    }
    if (/^\s*&gt;\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*&gt;\s?/, '')); i++; }
      out.push('<blockquote>' + inline(buf.join('<br>')) + '</blockquote>'); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\.\s+/.test(line); const buf = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        buf.push('<li>' + inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, '')) + '</li>'); i++;
      }
      out.push((ordered ? '<ol>' : '<ul>') + buf.join('') + (ordered ? '</ol>' : '</ul>')); continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }
    const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*(```|#{1,6}\s|\||&gt;|[-*]\s|\d+\.\s)/.test(lines[i])) {
      buf.push(lines[i]); i++;
    }
    out.push('<p>' + inline(buf.join('<br>')) + '</p>');
  }
  return out.join('');
}

/* ============================================================================
   렌더링
   ========================================================================== */
function addUserTurn(text) {
  els.empty.hidden = true;
  const wrap = el('div', 'turn user');
  wrap.appendChild(el('div', 'bubble-user', esc(text)));
  els.inner.appendChild(wrap);
  scrollToEnd();
}

function addAnswerShell() {
  const turn = el('div', 'turn');
  turn.innerHTML =
    '<div class="answer">' +
      '<div class="avatar" aria-hidden="true">CA</div>' +
      '<div class="answer-body">' +
        '<div class="rw"></div>' +
        '<div class="md" data-role="md"><div class="typing"><i></i><i></i><i></i></div></div>' +
        '<div class="ev"></div>' +
        '<div class="ac"></div>' +
      '</div>' +
    '</div>';
  els.inner.appendChild(turn);
  scrollToEnd();
  return {
    turn,
    rw: turn.querySelector('.rw'),
    md: turn.querySelector('[data-role="md"]'),
    ev: turn.querySelector('.ev'),
    ac: turn.querySelector('.ac'),
  };
}

function renderRewrite(node, rw) {
  if (!rw) return;
  // 재작성이 없던 숫자·식별자를 지어내면 서버가 버리고 원문으로 검색한다.
  // 그 사실을 숨기면 "왜 이 답이 나왔나"를 사용자가 되짚을 수 없다.
  if (rw.skipped === 'invented_facts' && rw.rejected) {
    node.innerHTML =
      '<div class="rewrite is-rejected">' +
        '<b>재작성을 버리고 원문으로 검색했습니다</b>' +
        '<q>' + esc(rw.rejected) + '</q>' +
        '<span class="why">대화에 없던 ' + esc((rw.invented || []).join(', ')) + ' 를 만들어 냈습니다</span>' +
      '</div>';
    return;
  }
  if (!rw.applied || !rw.rewritten) return;
  node.innerHTML =
    '<div class="rewrite"><b>후속 질문을 이렇게 이해했습니다</b><q>' + esc(rw.rewritten) + '</q></div>';
}

/* 경로 배지. 에이전트로 갈 때는 답변보다 **먼저** 그려서 대기 이유를 알린다. */
function renderRoute(node, ev) {
  if (!ev || !ev.mode) return;
  const agent = ev.mode === 'agent';
  const box = el('div', 'route' + (agent ? ' is-agent' : ''));
  box.innerHTML =
    '<span class="tag">' + (agent ? '에이전트 검색' : '단발 검색') + '</span>' +
    '<span class="why">' + esc(ev.reason || '') + '</span>';
  node.appendChild(box);
}

const BADGE = { doc: 'DOC', code: 'CODE', commit: 'COMMIT' };

function renderEvidence(node, sources, retrieval) {
  node.innerHTML = '';
  if (!sources || !sources.length) return;

  const head = el('div', 'evidence-head', '근거 ' + sources.length + '건');
  const box = el('div', 'evidence');
  box.appendChild(head);

  const byPath = {};
  (retrieval && retrieval.picked || []).forEach(p => { byPath[p.source] = p; });

  sources.forEach((s, i) => {
    const type = BADGE[s.doc_type] ? s.doc_type : 'doc';
    const d = el('details', 'src');
    d.dataset.idx = String(i + 1);
    const score = byPath[s.source];
    d.innerHTML =
      '<summary>' +
        '<span class="src-idx">' + (i + 1) + '</span>' +
        '<span class="badge ' + type + '">' + BADGE[type] + '</span>' +
        '<span class="src-path">' + esc(s.source) +
          (s.section ? '<span class="src-sec"> › ' + esc(s.section) + '</span>' : '') +
        '</span>' +
        (score ? '<span class="src-score">cos ' + score.similarity + '</span>' : '') +
      '</summary>' +
      '<div class="src-body">' + esc(s.snippet || '(발췌 없음)') + '</div>';
    box.appendChild(d);
  });

  if (retrieval && retrieval.picked) box.appendChild(renderDiagnostics(retrieval));
  node.appendChild(box);
}

/* 검색 진단 — 이 제품의 차별점이라 접어두되 항상 열어볼 수 있게 둔다 */
function renderDiagnostics(r) {
  const d = el('details', 'diag');
  const rows = (r.picked || []).map((p, i) =>
    '<tr><td>' + (i + 1) + '</td><td class="src-path">' + esc(p.source) + '</td>' +
    '<td class="num">' + p.similarity + '</td><td class="num">' + p.bm25 + '</td></tr>').join('');
  d.innerHTML =
    '<summary>검색 진단 보기</summary>' +
    '<div class="diag-body">' +
      '<dl class="kv">' +
        '<dt>판정</dt><dd>' + esc(r.reason || '-') + '</dd>' +
        (r.intent
          ? '<dt>질문 의도</dt><dd>' + esc(r.intent.axis) +
            ' <span class="why">(' + esc(r.intent.reason) + ')</span></dd>' +
            '<dt>심볼 슬롯</dt><dd>' +
              (r.intent.symbol_slots
                 ? r.intent.symbol_slots + '칸 (심볼 매칭 ' + (r.symbol_hits ?? 0) + '건)'
                 : '끔 — 문서·커밋 질문이라 설계 근거를 밀어내지 않게') +
            '</dd>'
          : '') +
        '<dt>최고 코사인</dt><dd>' + (r.best_similarity ?? '-') + '</dd>' +
        '<dt>최고 BM25</dt><dd>' + (r.best_bm25 ?? '-') + '</dd>' +
        '<dt>리랭커</dt><dd>' + (r.reranked ? '적용' : '미적용 (측정 결과 기본 OFF)') + '</dd>' +
      '</dl>' +
      '<table><thead><tr><th>#</th><th>청크</th><th>코사인</th><th>BM25</th></tr></thead><tbody>' +
      rows + '</tbody></table>' +
    '</div>';
  return d;
}

function renderActions(node, ctx) {
  node.innerHTML = '';
  const bar = el('div', 'actions');

  const copy = el('button', 'act', '복사');
  copy.type = 'button';
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(ctx.text); toast('답변을 복사했습니다'); }
    catch { toast('복사에 실패했습니다'); }
  };

  const up = el('button', 'act', '👍 도움됨');
  const down = el('button', 'act', '👎 아쉬움');
  up.type = down.type = 'button';
  up.setAttribute('aria-pressed', 'false'); down.setAttribute('aria-pressed', 'false');
  const vote = (verdict, btn, other) => {
    btn.setAttribute('aria-pressed', 'true'); other.setAttribute('aria-pressed', 'false');
    fetch('/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: ctx.question, verdict, answer: ctx.text, mode: ctx.mode }),
    }).catch(() => {});
    toast(verdict === 'up' ? '피드백 감사합니다' : '피드백이 평가셋 후보로 기록됩니다');
  };
  up.onclick = () => vote('up', up, down);
  down.onclick = () => vote('down', down, up);

  bar.append(copy, up, down);
  if (ctx.mode) bar.appendChild(el('span', 'src-score', ctx.mode));
  node.appendChild(bar);
}

function renderError(node, message, retry) {
  node.innerHTML = '';
  const box = el('div', 'error');
  box.appendChild(el('div', '', '<strong>답변을 가져오지 못했습니다.</strong><br>' + esc(message)));
  if (retry) {
    const b = el('button', 'btn', '다시 시도');
    b.type = 'button'; b.onclick = retry;
    box.appendChild(b);
  }
  node.appendChild(box);
}

/* 스크롤 — 사용자가 위로 올려 읽는 중이면 따라가지 않는다(현업에서 흔한 요구) */
let stickBottom = true;
els.thread.addEventListener('scroll', () => {
  const gap = els.thread.scrollHeight - els.thread.scrollTop - els.thread.clientHeight;
  stickBottom = gap < 90;
});
function scrollToEnd(force) {
  if (force || stickBottom) els.thread.scrollTop = els.thread.scrollHeight;
}

/* ============================================================================
   스트리밍 — NDJSON 을 읽어 토큰을 붙인다. 렌더는 rAF 로 묶어 과도한 리플로우를 막는다.
   ========================================================================== */
async function ask(question, retryOf) {
  if (state.streaming) return;
  const trimmed = question.trim();
  if (!trimmed) return;

  if (!retryOf) addUserTurn(trimmed);
  const node = addAnswerShell();
  setStreaming(true);

  const ctx = { question: trimmed, text: '', mode: '', sources: [], retrieval: null };
  state.controller = new AbortController();

  let pending = '', frame = 0, started = false;
  const flush = () => {
    frame = 0;
    if (!started) { node.md.innerHTML = ''; started = true; }
    node.md.innerHTML = renderMarkdown(ctx.text, state.devMode);
    node.md.classList.add('caret');
    scrollToEnd();
  };
  const schedule = () => { if (!frame) frame = requestAnimationFrame(flush); };

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: trimmed, dev_mode: state.devMode,
        history: state.history.slice(-6),
      }),
      signal: state.controller.signal,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.type === 'rewrite') { renderRewrite(node.rw, ev); }
        else if (ev.type === 'route') { renderRoute(node.rw, ev); }
        else if (ev.type === 'sources') { ctx.sources = ev.sources || []; }
        else if (ev.type === 'token') { ctx.text += ev.text; schedule(); }
        else if (ev.type === 'error') { throw new Error(ev.message || '알 수 없는 오류'); }
        else if (ev.type === 'done') { ctx.mode = ev.mode; ctx.retrieval = ev.retrieval || null; }
      }
    }

    if (frame) cancelAnimationFrame(frame);
    node.md.innerHTML = renderMarkdown(ctx.text, state.devMode) || '<p>(빈 응답)</p>';
    node.md.classList.remove('caret');
    renderEvidence(node.ev, ctx.sources, ctx.retrieval);
    renderActions(node.ac, ctx);
    wireFootnotes(node);
    els.live.textContent = ctx.text.slice(0, 400);

    state.history.push({ role: 'user', content: trimmed });
    state.history.push({ role: 'assistant', content: ctx.text });
    updateTurnCount();
  } catch (err) {
    if (frame) cancelAnimationFrame(frame);
    node.md.classList.remove('caret');
    if (err.name === 'AbortError') {
      if (!ctx.text) node.md.innerHTML = '<p style="color:var(--c-text-mute)">중단되었습니다.</p>';
      else { renderEvidence(node.ev, ctx.sources, ctx.retrieval); renderActions(node.ac, ctx); }
    } else {
      node.md.innerHTML = '';
      renderError(node.ev, err.message, () => { node.turn.remove(); ask(trimmed, true); });
    }
  } finally {
    setStreaming(false);
    state.controller = null;
    scrollToEnd();
  }
}

/* 각주 [n] → 해당 출처 카드를 열고 잠시 강조 */
function wireFootnotes(node) {
  node.md.querySelectorAll('.fn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.dataset.fn;
      const card = node.ev.querySelector('.src[data-idx="' + idx + '"]');
      if (!card) { toast('해당 근거를 찾을 수 없습니다'); return; }
      card.open = true;
      card.dataset.hl = '1';
      card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      setTimeout(() => { delete card.dataset.hl; }, 1600);
    });
  });
}

function setStreaming(on) {
  state.streaming = on;
  els.send.classList.toggle('stop', on);
  els.send.setAttribute('aria-label', on ? '중단' : '전송');
  els.send.innerHTML = on
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>'
    : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
}

function updateTurnCount() {
  const n = Math.floor(state.history.length / 2);
  els.turnCount.textContent = String(n);
  els.turnPill.hidden = n === 0;
}

/* ============================================================================
   입력
   ========================================================================== */
function autoGrow() {
  els.q.style.height = 'auto';
  els.q.style.height = Math.min(els.q.scrollHeight, 168) + 'px';
}
els.q.addEventListener('input', autoGrow);

els.q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {   // isComposing: 한글 조합 중 전송 방지
    e.preventDefault();
    els.form.requestSubmit();
  }
});

els.form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (state.streaming) { state.controller && state.controller.abort(); return; }
  const v = els.q.value;
  els.q.value = ''; autoGrow();
  ask(v);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.streaming) { state.controller && state.controller.abort(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); els.q.focus(); }
});

/* --- 개발자 모드 / 테마 / 새 대화 ---------------------------------------- */
const devToggle = $('devmode');
devToggle.checked = state.devMode;
devToggle.addEventListener('change', () => {
  state.devMode = devToggle.checked;
  localStorage.setItem('devMode', state.devMode ? '1' : '0');
  toast(state.devMode ? '개발자 모드: 코드 원문을 인용합니다' : '개발자 모드 해제');
});

const THEMES = [['auto', '시스템', '시스템 설정 따름'], ['light', '라이트', '항상 밝게'], ['dark', '다크', '항상 어둡게']];
function applyTheme() {
  document.documentElement.dataset.theme = state.theme;
  const t = THEMES.find(x => x[0] === state.theme) || THEMES[0];
  $('theme-btn').textContent = t[1];
  $('theme-hint').textContent = t[2];
}
$('theme-btn').addEventListener('click', () => {
  const i = THEMES.findIndex(x => x[0] === state.theme);
  state.theme = THEMES[(i + 1) % THEMES.length][0];
  localStorage.setItem('theme', state.theme);
  applyTheme();
});
applyTheme();

$('new-chat').addEventListener('click', () => {
  if (state.streaming) state.controller && state.controller.abort();
  state.history = [];
  els.inner.querySelectorAll('.turn').forEach(n => n.remove());
  els.empty.hidden = false;
  updateTurnCount();
  els.q.focus();
  toast('새 대화를 시작합니다');
});

/* --- 모바일 드로어 -------------------------------------------------------- */
const app = $('app');
const setDrawer = (open) => {
  app.dataset.drawer = open ? 'open' : '';
  $('hamburger').setAttribute('aria-expanded', String(open));
};
$('hamburger').addEventListener('click', () => setDrawer(app.dataset.drawer !== 'open'));
$('scrim').addEventListener('click', () => setDrawer(false));

/* ============================================================================
   초기 로드 — 지식원 목록·상태·추천 질문
   ========================================================================== */
async function boot() {
  try {
    const [topics, health] = await Promise.all([
      fetch('/topics').then(r => r.json()),
      fetch('/health').then(r => r.json()).catch(() => null),
    ]);

    els.stDoc.textContent = topics.count ?? '–';
    els.stCode.textContent = topics.code_count ?? '–';

    els.files.innerHTML = '';
    (topics.files || []).slice(0, 60).forEach(f => {
      const n = el('div', 'file-item', esc(f));
      n.setAttribute('role', 'listitem'); n.title = f;
      els.files.appendChild(n);
    });

    els.chips.innerHTML = '';
    (topics.suggestions || []).slice(0, 6).forEach(s => {
      const b = el('button', 'chip', esc(s));
      b.type = 'button';
      b.onclick = () => { ask(s); };   // 입력창에 남기지 않는다 — 전송된 질문이 두 번 보이면 혼란스럽다
      els.chips.appendChild(b);
    });

    const llm = (health && health.llm_provider) || topics.llm || 'unknown';
    const ok = llm !== 'extractive';
    els.statusDot.classList.toggle('warn', !ok);
    els.statusText.textContent = ok ? '연결됨' : 'LLM 미연결';
    els.modeNote.textContent = ok
      ? (health ? health.corpus_profile + ' · ' + llm : llm)
      : 'extractive 모드 — 검색 발췌만 표시됩니다';
  } catch (e) {
    els.statusDot.classList.add('warn');
    els.statusText.textContent = '서버 응답 없음';
  }
  autoGrow();
  els.q.focus();
}
boot();
</script>
