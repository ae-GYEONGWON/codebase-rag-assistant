<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>stock_prod RAG 챗봇</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Malgun Gothic", sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:16px 20px; border-bottom:1px solid var(--line); }
    header h1 { margin:0; font-size:16px; }
    header p { margin:4px 0 0; color:var(--muted); font-size:12px; }
    #log { max-width:820px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
    .msg { padding:12px 14px; border-radius:10px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
    .user { align-self:flex-end; background:#0369a1; max-width:80%; }
    .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); max-width:92%; }
    .sources { margin-top:8px; font-size:12px; color:var(--muted); }
    .sources code { color:var(--accent); }
    form { position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--line);
           display:flex; gap:8px; padding:14px; max-width:820px; margin:0 auto; }
    input { flex:1; padding:12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:14px; }
    button { padding:12px 18px; border:0; border-radius:8px; background:var(--accent); color:#04263a; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .hint { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>📈 stock_prod 문서 RAG 챗봇</h1>
    <p>KOSPI200 선물·옵션 자동매매 시스템의 memory 문서에만 근거해 답합니다.</p>
  </header>
  <div id="log">
    <div class="msg bot">안녕하세요. stock_prod 프로젝트에 대해 무엇이든 물어보세요.
<span class="hint">예: "현재 운용 모드가 뭐야?", "zombie recovery 로직 설명해줘", "sl 캡은 몇 %야?"</span></div>
  </div>
  <form id="f">
    <input id="q" placeholder="질문을 입력하세요…" autocomplete="off" autofocus />
    <button id="send" type="submit">전송</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('f');
    const input = document.getElementById('q');
    const btn = document.getElementById('send');

    function bubble(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      log.appendChild(d);
      d.scrollIntoView({ behavior: 'smooth' });
      return d;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      bubble(q, 'user');
      input.value = '';
      btn.disabled = true;
      const thinking = bubble('생각 중…', 'bot');
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        thinking.textContent = data.answer || '(빈 응답)';
        if (data.sources && data.sources.length) {
          const s = document.createElement('div');
          s.className = 'sources';
          s.innerHTML = '출처: ' + data.sources
            .map(x => '<code>' + x.source + (x.section ? ' &gt; ' + x.section : '') + '</code>')
            .join(', ');
          thinking.appendChild(s);
        }
      } catch (err) {
        thinking.textContent = '오류: ' + err;
      } finally {
        btn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
